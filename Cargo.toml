[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/cliplite-core", "crates/cliplite-recorder"]

[workspace.package]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
cliplite-core = { path = "crates/cliplite-core" }
anyhow     = "1"
dirs       = "5"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
which      = "6"
